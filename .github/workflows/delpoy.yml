name: Deploy via Docker

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        run: mvn -B package --file pom.xml

      - name: Build Docker image
        run: docker build -t sea-battle:latest .

      - name: Save Docker image to file
        run: docker save sea-battle:latest -o sea-battle.tar

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy Docker image to server
        run: scp -o StrictHostKeyChecking=no sea-battle.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/sea-battle/sea-battle.tar

      - name: Load image and restart container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /home/${{ secrets.SERVER_USER }}/sea-battle &&
            docker load -i sea-battle.tar &&
            docker compose down &&
            docker compose up -d
          "
